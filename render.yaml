services:
  - type: web
    name: bookstore-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DB_HOST
        value: mysql-23696656-chaisak-503dc1.k.aivencloud.com
      - key: DB_PORT
        value: "27939"
      - key: DB_USER
        value: avnadmin
      - key: DB_NAME
        value: bookstore_db
      - key: DB_SSL_REQUIRED
        value: "true"
      - key: JWT_SECRET
        value: my_bookstore_secret_jwt_key_32_bytes_security!
      - key: FRONTEND_URL
        value: "*"
