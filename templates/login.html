<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <p>Email:<br><input type="text" id="email" required style="width: 250px;"></p>
        <p>Password:<br><input type="password" id="password" required style="width: 250px;"></p>
        <button type="submit">Login</button>
    </form>

    <p id="errorMsg" style="color: red; font-weight: bold;"></p>

    <hr style="max-width: 500px; margin-left: 0;">
    <p>Don't have an account? <a href="/register/">Register here</a></p>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            document.getElementById('errorMsg').innerText = '';
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const res = await fetch('http://localhost:4000/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem("token", data.token);
                window.location.href = '/';
            } else {
                document.getElementById('errorMsg').innerText = data.error || 'Login failed';
            }
        }
    </script>
</body>
</html>
